name: Apply Connect security hardening

on:
  push:
    branches: [release/3.6.0-connect]
    paths:
      - '.connect-security/READY'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/3.6.0-connect
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - name: Apply security patch
        id: apply
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/apply-connect-security-hardening.cjs 2>&1 | tee .connect-security/apply.log
      - name: Validate modified sources
        id: validate
        if: steps.apply.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            node --check server/model.cjs
            node --check server/create-server.cjs
            node --check server/connect.cjs
            node --check test/connect-3.6.test.cjs
            npm run build:web
          } 2>&1 | tee .connect-security/validate.log
      - name: Run Connect and core regression tests
        id: tests
        if: steps.apply.outcome == 'success' && steps.validate.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node --test test/connect-3.6.test.cjs test/server.test.cjs test/release-3.3.0-regressions.test.cjs 2>&1 | tee .connect-security/tests.log
      - name: Commit verified hardening or diagnostic
        if: always()
        shell: bash
        env:
          APPLY_OUTCOME: ${{ steps.apply.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          set -euo pipefail
          git config user.name 'nexora-release-bot'
          git config user.email 'nexora-release-bot@users.noreply.github.com'
          if [[ "$APPLY_OUTCOME" == "success" && "$VALIDATE_OUTCOME" == "success" && "$TESTS_OUTCOME" == "success" ]]; then
            rm -rf .connect-security
            rm -f .github/workflows/connect-security-hardening.yml scripts/apply-connect-security-hardening.cjs
            git add -A
            git diff --cached --check
            git commit -m 'fix(connect): bind calls to sessions and scope read receipts'
          else
            {
              echo "apply=$APPLY_OUTCOME"
              echo "validate=$VALIDATE_OUTCOME"
              echo "tests=$TESTS_OUTCOME"
              echo
              for file in .connect-security/apply.log .connect-security/validate.log .connect-security/tests.log; do
                if [[ -f "$file" ]]; then
                  echo "===== $file ====="
                  tail -n 240 "$file"
                  echo
                fi
              done
            } > .connect-security/FAILURE.log
            git checkout -- server/model.cjs server/create-server.cjs server/connect.cjs test/connect-3.6.test.cjs || true
            git add .connect-security/FAILURE.log
            git commit -m 'chore(connect): retain security hardening diagnostics'
          fi
          git push origin HEAD:release/3.6.0-connect
