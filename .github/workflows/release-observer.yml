name: Nexora release status observer

on:
  issue_comment:
    types: [created]

permissions:
  actions: read
  issues: write
  pull-requests: write

jobs:
  report:
    if: >-
      github.event.issue.number == 101 &&
      (github.event.comment.body == '/nexora-release-status' ||
      startsWith(github.event.comment.body, '/nexora-release-log '))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report 3.5.0 publication status or failed log
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMAND: ${{ github.event.comment.body }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$COMMAND" == "/nexora-release-status" ]]; then
            runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yml --limit 5 --json databaseId,status,conclusion,headSha,displayTitle,event,url,createdAt,updatedAt)"
            body="$(RUNS_JSON="$runs" python - <<'PY'
          import json, os
          runs = json.loads(os.environ['RUNS_JSON'])
          lines = ['## Nexora 3.5.0 release workflow status', '']
          if not runs:
              lines.append('No release workflow runs found.')
          for run in runs:
              lines.extend([
                  f"- run `{run['databaseId']}` — **{run['status']} / {run.get('conclusion') or 'pending'}**",
                  f"  - event: `{run['event']}`",
                  f"  - head: `{run['headSha']}`",
                  f"  - title: {run['displayTitle']}",
                  f"  - created: `{run['createdAt']}`; updated: `{run['updatedAt']}`",
                  f"  - URL: {run['url']}",
              ])
          print('\n'.join(lines))
          PY
            )"
          else
            run_id="${COMMAND#'/nexora-release-log '}"
            if [[ ! "$run_id" =~ ^[0-9]+$ ]]; then
              echo "Invalid run ID" >&2
              exit 1
            fi
            gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --log-failed > failed.log
            python - "$run_id" <<'PY' > comment.md
          import pathlib, sys
          run_id = sys.argv[1]
          text = pathlib.Path('failed.log').read_text(encoding='utf-8', errors='replace')
          lines = text.splitlines()[-220:]
          payload = '\n'.join(lines)
          if len(payload) > 58000:
              payload = payload[-58000:]
          print(f"## Failed log for release run `{run_id}`\n\n```text\n{payload}\n```")
          PY
            body="$(cat comment.md)"
          fi
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" -f body="$body"
