name: Finalize Connect website accessibility

on:
  pull_request:
    branches: [main]
    paths:
      - '.connect-site-fix/READY'
      - '.github/workflows/connect-site-fix.yml'
      - 'scripts/fix-connect-reduced-motion.cjs'

permissions:
  contents: write

concurrency:
  group: connect-site-fix-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fix:
    if: github.event_name == 'pull_request' && github.head_ref == 'release/3.6.0-connect'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/3.6.0-connect
          fetch-depth: 0
      - name: Detect marker
        id: marker
        shell: bash
        run: |
          if test -f .connect-site-fix/READY; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.marker.outputs.run == 'true'
        with:
          node-version: 22.16.0
          cache: npm
      - if: steps.marker.outputs.run == 'true'
        run: npm ci
      - name: Apply targeted reduced-motion fix
        if: steps.marker.outputs.run == 'true'
        run: node scripts/fix-connect-reduced-motion.cjs
      - name: Validate restored website and release regression
        if: steps.marker.outputs.run == 'true'
        run: |
          node website/validate.mjs
          node website/validate-restored.mjs
          node --test --test-concurrency=1 test/release-3.3.0-regressions.test.cjs
      - name: Commit verified website fix
        if: steps.marker.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .connect-site-fix
          rm -f scripts/fix-connect-reduced-motion.cjs
          git config user.name 'nexora-release-bot'
          git config user.email 'nexora-release-bot@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(website): preserve reduced-motion accessibility without disabling restored UX'
          git push origin HEAD:release/3.6.0-connect
