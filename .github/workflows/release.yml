name: Nexora 3.5.0 unsigned stable release

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      release_ref:
        description: Commit, branch or existing v3.5.0 tag to publish
        required: true
        default: main
        type: string

permissions:
  contents: write
  statuses: write

concurrency:
  group: nexora-3-5-0-unsigned-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      startsWith(github.event.head_commit.message, 'release: Nexora 3.5.0')) ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      startsWith(github.event.workflow_run.head_commit.message, 'release: Nexora 3.5.0'))
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.event_name == 'workflow_dispatch' && inputs.release_ref || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Resolve authorized unsigned release identity
        id: identity
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = node -p "require('./package.json').version"
          if ($version -ne "3.5.0") { throw "This workflow publishes only Nexora 3.5.0; found $version" }
          $tag = "v$version"
          $head = (git rev-parse HEAD).Trim()
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "official_tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "head_sha=$head" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "PUBLISH_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Mark release status pending
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sha = '${{ steps.identity.outputs.head_sha }}'
          $url = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          gh api --method POST "repos/$env:GITHUB_REPOSITORY/statuses/$sha" -f state=pending -f context="release/3.5.0" -f description="Building and verifying unsigned Nexora 3.5.0 artifacts" -f target_url="$url" | Out-Null

      - name: Install dependencies and run complete source gate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          npm ci
          npm run release:check
          npm run release:tag-check

      - name: Build source and PWA assets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = '${{ steps.identity.outputs.version }}'
          New-Item -ItemType Directory -Force artifacts | Out-Null
          git archive --format=zip --output "artifacts/Nexora-$version-source.zip" HEAD
          if ($LASTEXITCODE -ne 0) { throw "Unable to archive release commit" }
          if (-not (Test-Path -LiteralPath "client/dist/index.html")) { throw "Production web build is missing" }
          Compress-Archive -Path "client/dist/*" -DestinationPath "artifacts/Nexora-PWA-$version.zip" -CompressionLevel Optimal -Force

      - name: Build explicitly unsigned Android release APK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Remove-Item Env:NEXORA_ANDROID_KEYSTORE_PATH -ErrorAction SilentlyContinue
          Remove-Item Env:NEXORA_ANDROID_KEYSTORE_PASSWORD -ErrorAction SilentlyContinue
          Remove-Item Env:NEXORA_ANDROID_KEY_ALIAS -ErrorAction SilentlyContinue
          Remove-Item Env:NEXORA_ANDROID_KEY_PASSWORD -ErrorAction SilentlyContinue
          $version = '${{ steps.identity.outputs.version }}'
          gradle -p android :app:assembleRelease --no-daemon
          if ($LASTEXITCODE -ne 0) { throw "Unsigned Android release build failed" }
          $apk = Get-ChildItem -Path "android/app/build/outputs/apk/release" -Filter "*.apk" | Sort-Object Length -Descending | Select-Object -First 1
          if (-not $apk) { throw "Unsigned Android release APK was not created" }
          $target = "artifacts/Nexora-Android-$version-UNSIGNED.apk"
          Copy-Item $apk.FullName $target -Force

          $buildTools = Get-ChildItem -Path (Join-Path $env:ANDROID_HOME "build-tools") -Directory | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $buildTools) { throw "Android build-tools are unavailable" }
          $apksigner = Join-Path $buildTools.FullName "apksigner.bat"
          if (-not (Test-Path -LiteralPath $apksigner)) { throw "apksigner is unavailable" }
          "NEXORA_APKSIGNER_PATH=$apksigner" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $stdout = Join-Path $env:RUNNER_TEMP "nexora-apksigner-unsigned.stdout.txt"
          $stderr = Join-Path $env:RUNNER_TEMP "nexora-apksigner-unsigned.stderr.txt"
          $verify = Start-Process -FilePath $apksigner -ArgumentList @("verify", "--verbose", "--print-certs", $target) -Wait -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          @(
            Get-Content -LiteralPath $stdout -ErrorAction SilentlyContinue
            Get-Content -LiteralPath $stderr -ErrorAction SilentlyContinue
            "Verification exit code: $($verify.ExitCode)"
            "Expected state: unsigned"
          ) | Set-Content -Encoding utf8 artifacts/ANDROID-UNSIGNED-EVIDENCE.txt
          if ($verify.ExitCode -eq 0) { throw "Android artifact was unexpectedly signed; unsigned publication must be explicit" }

      - name: Generate and validate SPDX SBOM
        shell: bash
        run: |
          set -euo pipefail
          version='${{ steps.identity.outputs.version }}'
          output="artifacts/Nexora-${version}.spdx.json"
          if ! npm sbom --omit=dev --sbom-format=spdx > "$output"; then
            node scripts/generate-spdx-sbom.cjs "$output"
          fi
          node -e "const fs=require('node:fs');const p=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));if(p.spdxVersion!=='SPDX-2.3'||!Array.isArray(p.packages)||!p.packages.length)process.exit(1)" "$output"

      - name: Build explicitly unsigned Windows installers
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Remove-Item Env:CSC_LINK -ErrorAction SilentlyContinue
          Remove-Item Env:CSC_KEY_PASSWORD -ErrorAction SilentlyContinue
          $env:CSC_IDENTITY_AUTO_DISCOVERY = "false"
          $version = '${{ steps.identity.outputs.version }}'

          npx electron-builder --config electron-builder.client.yml --win nsis --publish never
          if ($LASTEXITCODE -ne 0) { throw "Unsigned Client build failed" }
          npx electron-builder --config electron-builder.server.yml --win nsis --publish never
          if ($LASTEXITCODE -ne 0) { throw "Unsigned Server build failed" }

          $sourceClient = "release/client/Nexora-Client-Setup-$version.exe"
          $sourceServer = "release/server/Nexora-Server-Setup-$version.exe"
          $client = "artifacts/Nexora-Client-Setup-$version-UNSIGNED.exe"
          $server = "artifacts/Nexora-Server-Setup-$version-UNSIGNED.exe"
          foreach ($source in @($sourceClient, $sourceServer)) {
            if (-not (Test-Path -LiteralPath $source -PathType Leaf)) { throw "Missing Windows installer: $source" }
          }
          Copy-Item $sourceClient $client -Force
          Copy-Item $sourceServer $server -Force

          $evidence = foreach ($asset in @($client, $server)) {
            $signature = Get-AuthenticodeSignature -FilePath $asset
            if ($signature.Status -ne "NotSigned") {
              throw "Artifact is not explicitly unsigned: $asset ($($signature.Status))"
            }
            [ordered]@{
              asset = [IO.Path]::GetFileName($asset)
              status = [string]$signature.Status
              statusMessage = [string]$signature.StatusMessage
              expected = "NotSigned"
            }
          }
          $evidence | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 artifacts/WINDOWS-UNSIGNED-EVIDENCE.json

      - name: Installed package smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = '${{ steps.identity.outputs.version }}'
          $root = "C:\NexoraUnsignedReleaseSmoke"
          $clientDir = "$root\Client"
          $serverDir = "$root\Server"
          New-Item -ItemType Directory -Force $root | Out-Null
          foreach ($item in @(
            @{ Installer = "artifacts/Nexora-Client-Setup-$version-UNSIGNED.exe"; Directory = $clientDir },
            @{ Installer = "artifacts/Nexora-Server-Setup-$version-UNSIGNED.exe"; Directory = $serverDir }
          )) {
            $process = Start-Process -FilePath $item.Installer -ArgumentList @("/S", "/D=$($item.Directory)") -PassThru
            if (-not $process.WaitForExit(180000)) {
              $process.Kill($true)
              throw "Installer smoke timed out: $($item.Installer)"
            }
            if ($process.ExitCode -ne 0) { throw "Installer smoke failed: $($item.Installer) exit $($process.ExitCode)" }
          }
          foreach ($exe in @(
            (Join-Path $clientDir "Nexora Client.exe"),
            (Join-Path $serverDir "Nexora Server.exe")
          )) {
            if (-not (Test-Path -LiteralPath $exe)) { throw "Installed runtime missing: $exe" }
            if ((Get-Item -LiteralPath $exe).VersionInfo.ProductVersion -notlike "$version*") {
              throw "Installed runtime version mismatch: $exe"
            }
            if ((Get-AuthenticodeSignature -FilePath $exe).Status -ne "NotSigned") {
              throw "Installed runtime signing state is not explicit: $exe"
            }
          }

      - name: Create unsigned release evidence and checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = '${{ steps.identity.outputs.version }}'
          $assets = @(
            "artifacts/Nexora-Client-Setup-$version-UNSIGNED.exe",
            "artifacts/Nexora-Server-Setup-$version-UNSIGNED.exe",
            "artifacts/Nexora-Android-$version-UNSIGNED.apk",
            "artifacts/Nexora-PWA-$version.zip",
            "artifacts/Nexora-$version-source.zip",
            "artifacts/Nexora-$version.spdx.json",
            "artifacts/WINDOWS-UNSIGNED-EVIDENCE.json",
            "artifacts/ANDROID-UNSIGNED-EVIDENCE.txt"
          )
          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) { throw "Missing release asset: $asset" }
          }
          $evidence = [ordered]@{
            schemaVersion = 1
            version = $version
            commitSha = '${{ steps.identity.outputs.head_sha }}'
            officialTag = '${{ steps.identity.outputs.official_tag }}'
            publishedAsPrerelease = $false
            signed = $false
            distribution = "stable-unsigned-manual-download"
            ownerAuthorized = $true
            updaterMetadataPublished = $false
            warning = "Windows and Android binaries are not digitally signed. Verify SHA-256 checksums and install manually."
            githubRunId = $env:GITHUB_RUN_ID
            githubRunAttempt = $env:GITHUB_RUN_ATTEMPT
            generatedAt = [DateTime]::UtcNow.ToString("o")
            sourceGate = "passed"
            installedPackageSmoke = "passed"
            assetNames = @($assets | ForEach-Object { [IO.Path]::GetFileName($_) })
          }
          $evidence | ConvertTo-Json -Depth 6 | Set-Content -Encoding utf8 artifacts/RELEASE-EVIDENCE.json
          $assets += "artifacts/RELEASE-EVIDENCE.json"
          Get-FileHash $assets -Algorithm SHA256 | Sort-Object Path | ForEach-Object {
            "$($_.Hash.ToLowerInvariant())  $([IO.Path]::GetFileName($_.Path))"
          } | Set-Content -Encoding ascii artifacts/SHA256SUMS.txt
          "RELEASE_ASSETS=$($assets -join ';')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create immutable annotated tag
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $remote = git ls-remote --tags origin "refs/tags/$env:PUBLISH_TAG"
          if (-not [string]::IsNullOrWhiteSpace(($remote -join "`n"))) {
            git fetch --force origin "refs/tags/$env:PUBLISH_TAG`:refs/tags/$env:PUBLISH_TAG"
            if ((git rev-list -n 1 $env:PUBLISH_TAG).Trim() -ne '${{ steps.identity.outputs.head_sha }}') {
              throw "Immutable tag already points to another commit"
            }
          } else {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a $env:PUBLISH_TAG -m "Nexora ${{ steps.identity.outputs.version }} Mobile Continuity — unsigned distribution"
            git push origin "refs/tags/$env:PUBLISH_TAG"
            if ($LASTEXITCODE -ne 0) { throw "Unable to publish annotated tag" }
          }

      - name: Publish normal GitHub Release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = '${{ steps.identity.outputs.version }}'
          $assets = @($env:RELEASE_ASSETS -split ';') + @("artifacts/SHA256SUMS.txt")
          $absolute = @($assets | ForEach-Object { (Resolve-Path -LiteralPath $_).Path })
          $notes = "docs/releases/$version/RELEASE_NOTES.md"
          gh release view $env:PUBLISH_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            & gh release upload $env:PUBLISH_TAG @absolute --clobber
            if ($LASTEXITCODE -ne 0) { throw "Unable to update release assets" }
            gh release edit $env:PUBLISH_TAG --title "Nexora $version — Mobile Continuity (Unsigned distribution)" --notes-file $notes --latest
            if ($LASTEXITCODE -ne 0) { throw "Unable to update GitHub Release" }
          } else {
            & gh release create $env:PUBLISH_TAG @absolute --verify-tag --title "Nexora $version — Mobile Continuity (Unsigned distribution)" --notes-file $notes --latest
            if ($LASTEXITCODE -ne 0) { throw "Unable to publish GitHub Release" }
          }

      - name: Re-download and verify immutable release assets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force published | Out-Null
          gh release download $env:PUBLISH_TAG --dir published
          if ($LASTEXITCODE -ne 0) { throw "Unable to re-download release assets" }
          $sumFile = Join-Path published "SHA256SUMS.txt"
          if (-not (Test-Path -LiteralPath $sumFile)) { throw "Published checksums are missing" }
          foreach ($line in Get-Content -LiteralPath $sumFile) {
            if ([string]::IsNullOrWhiteSpace($line)) { continue }
            $parts = $line -split '\s+', 2
            $asset = Join-Path published $parts[1].Trim()
            if (-not (Test-Path -LiteralPath $asset)) { throw "Published asset is missing: $($parts[1])" }
            $actual = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $parts[0].ToLowerInvariant()) { throw "Published checksum mismatch: $asset" }
          }
          foreach ($required in @(
            "Nexora-Client-Setup-3.5.0-UNSIGNED.exe",
            "Nexora-Server-Setup-3.5.0-UNSIGNED.exe",
            "Nexora-Android-3.5.0-UNSIGNED.apk",
            "Nexora-PWA-3.5.0.zip",
            "Nexora-3.5.0-source.zip",
            "Nexora-3.5.0.spdx.json",
            "WINDOWS-UNSIGNED-EVIDENCE.json",
            "ANDROID-UNSIGNED-EVIDENCE.txt",
            "RELEASE-EVIDENCE.json"
          )) {
            if (-not (Test-Path -LiteralPath (Join-Path published $required))) { throw "Published release is missing $required" }
          }
          foreach ($forbidden in @("latest.yml", "server.yml")) {
            if (Test-Path -LiteralPath (Join-Path published $forbidden)) {
              throw "Unsigned release must not publish automatic-updater metadata: $forbidden"
            }
          }
          foreach ($asset in @(
            "published/Nexora-Client-Setup-3.5.0-UNSIGNED.exe",
            "published/Nexora-Server-Setup-3.5.0-UNSIGNED.exe"
          )) {
            if ((Get-AuthenticodeSignature -FilePath $asset).Status -ne "NotSigned") {
              throw "Published Windows artifact signing state changed: $asset"
            }
          }
          $publishedApk = "published/Nexora-Android-3.5.0-UNSIGNED.apk"
          $stdout = Join-Path $env:RUNNER_TEMP "nexora-apksigner-published.stdout.txt"
          $stderr = Join-Path $env:RUNNER_TEMP "nexora-apksigner-published.stderr.txt"
          $verify = Start-Process -FilePath $env:NEXORA_APKSIGNER_PATH -ArgumentList @("verify", "--verbose", "--print-certs", $publishedApk) -Wait -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if ($verify.ExitCode -eq 0) { throw "Published Android artifact was unexpectedly signed" }

      - name: Mark release status success
        if: success()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sha = '${{ steps.identity.outputs.head_sha }}'
          $url = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/releases/tag/${{ steps.identity.outputs.official_tag }}"
          gh api --method POST "repos/$env:GITHUB_REPOSITORY/statuses/$sha" -f state=success -f context="release/3.5.0" -f description="Nexora 3.5.0 release published and re-downloaded successfully" -f target_url="$url" | Out-Null

      - name: Mark release status failure
        if: failure()
        continue-on-error: true
        shell: pwsh
        run: |
          $sha = '${{ steps.identity.outputs.head_sha }}'
          if ([string]::IsNullOrWhiteSpace($sha)) { $sha = (git rev-parse HEAD).Trim() }
          $url = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          gh api --method POST "repos/$env:GITHUB_REPOSITORY/statuses/$sha" -f state=failure -f context="release/3.5.0" -f description="Nexora 3.5.0 release workflow failed; inspect the linked run" -f target_url="$url" | Out-Null
