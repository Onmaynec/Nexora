name: Apply Nexora 3.6.0 release completion patch

on:
  pull_request:
    branches: [main]
    paths:
      - '.connect-release-patch/**'
      - '.connect-security/**'
      - 'scripts/apply-connect-security-hardening.cjs'
      - '.github/workflows/connect-security-hardening.yml'
      - '.github/workflows/apply-connect-release.yml'

permissions:
  contents: write

concurrency:
  group: apply-connect-release-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'release/3.6.0-connect'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/3.6.0-connect
          fetch-depth: 0
          show-progress: false
      - name: Check patch readiness
        id: ready
        shell: bash
        run: |
          [[ -f .connect-release-patch/READY ]] && echo 'release=true' >> "$GITHUB_OUTPUT" || echo 'release=false' >> "$GITHUB_OUTPUT"
          [[ -f .connect-security/READY ]] && echo 'security=true' >> "$GITHUB_OUTPUT" || echo 'security=false' >> "$GITHUB_OUTPUT"
      - name: Reconstruct verified release patch
        if: steps.ready.outputs.release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat .connect-release-patch/[0-9][0-9] | tr -d '\r\n' | base64 --decode > /tmp/apply-connect-release.cjs.gz
          echo '79a0bcd417fb55c29b35efe70e7ce31a80514b0a287fc03bcbf6a6b01dcce7d3  /tmp/apply-connect-release.cjs.gz' | sha256sum --check --strict
          gzip -dc /tmp/apply-connect-release.cjs.gz > scripts/apply-connect-release-3.6.cjs
          node --check scripts/apply-connect-release-3.6.cjs
      - name: Apply release patch
        if: steps.ready.outputs.release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/apply-connect-release-3.6.cjs
          node --check scripts/check-release-consistency.cjs
          node --check test/release-consistency.test.cjs
          node scripts/check-release-consistency.cjs
          node --test test/release-consistency.test.cjs
          node --test --test-concurrency=1 test/connect-3.6.test.cjs
      - name: Apply and verify Connect security hardening
        if: steps.ready.outputs.security == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node scripts/apply-connect-security-hardening.cjs
          node --check server/model.cjs
          node --check server/create-server.cjs
          node --check server/connect.cjs
          node --check test/connect-3.6.test.cjs
          npm run build:web
          node --test --test-concurrency=1 test/connect-3.6.test.cjs
          node --test test/server.test.cjs test/release-3.3.0-regressions.test.cjs
          rm -rf .connect-security
          rm -f .github/workflows/connect-security-hardening.yml scripts/apply-connect-security-hardening.cjs
      - name: Commit completed candidate changes
        if: steps.ready.outputs.release == 'true' || steps.ready.outputs.security == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'nexora-release-bot'
          git config user.email 'nexora-release-bot@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(connect): complete release and security candidate gates'
          git push origin HEAD:release/3.6.0-connect
