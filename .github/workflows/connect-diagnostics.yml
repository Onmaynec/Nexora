name: Nexora 3.6.0 Connect diagnostics

on:
  push:
    branches: [release/3.6.0-connect]
    paths:
      - '.connect-diagnostics/READY'

permissions:
  contents: write

concurrency:
  group: connect-diagnostics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/3.6.0-connect
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - name: Capture focused and full diagnostics
        shell: bash
        env:
          NEXORA_SOAK_MINUTES: '1'
          NEXORA_SOAK_INTERVAL_MS: '500'
        run: |
          set +e
          mkdir -p release-evidence/3.6.0/diagnostics
          node --test --test-concurrency=1 test/connect-3.6.test.cjs > release-evidence/3.6.0/diagnostics/connect-focused.log 2>&1
          echo $? > release-evidence/3.6.0/diagnostics/connect-focused.status
          npm run test:unit > release-evidence/3.6.0/diagnostics/unit.log 2>&1
          echo $? > release-evidence/3.6.0/diagnostics/unit.status
          npm run test:soak > release-evidence/3.6.0/diagnostics/soak.log 2>&1
          echo $? > release-evidence/3.6.0/diagnostics/soak.status
          npm run check > release-evidence/3.6.0/diagnostics/check.log 2>&1
          echo $? > release-evidence/3.6.0/diagnostics/check.status
          set -e
          rm -rf .connect-diagnostics
          rm -f .github/workflows/connect-diagnostics.yml
      - name: Commit diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'nexora-release-bot'
          git config user.email 'nexora-release-bot@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'test(connect): record 3.6.0 diagnostics'
          git push origin HEAD:release/3.6.0-connect
