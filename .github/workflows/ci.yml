name: CI

on:
  push:
    branches: [main, release/3.6.0-connect]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # CONNECT_FINALIZATION_JOB_START
  finalize-connect-source:
    if: github.event_name == 'push' && github.ref == 'refs/heads/release/3.6.0-connect'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/3.6.0-connect
          fetch-depth: 0
          show-progress: false
      - name: Detect finalization marker
        id: marker
        shell: bash
        run: |
          if test -f .connect-finalization/READY; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.marker.outputs.run == 'true'
        with:
          node-version: 22.16.0
          cache: npm
      - if: steps.marker.outputs.run == 'true'
        run: npm ci
      - name: Apply final source gates
        if: steps.marker.outputs.run == 'true'
        run: node scripts/apply-connect-finalization.cjs
      - name: Validate final source gates
        if: steps.marker.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node --check server/connect.cjs
          node --check server/model.cjs
          node --check server/create-server.cjs
          node --check scripts/check-release-consistency.cjs
          node --check test/connect-3.6.test.cjs
          node --check test/release-consistency.test.cjs
          npm run release:consistency
          npm run check
          node --test --test-concurrency=1 test/release-consistency.test.cjs test/connect-3.6.test.cjs test/build-config.test.cjs test/release-3.2.5-regressions.test.cjs test/release-3.3.0-regressions.test.cjs
      - name: Commit verified finalization
        if: steps.marker.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/apply-connect-finalization.cjs
          git config user.name 'nexora-release-bot'
          git config user.email 'nexora-release-bot@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(connect): finalize release and client lifecycle gates'
          git push origin HEAD:release/3.6.0-connect
  # CONNECT_FINALIZATION_JOB_END

  verify:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:unit
      - run: npm run test:performance
      - run: npm run audit:security

  linux-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - run: npm test

  unit-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - name: Run unit suite with retained diagnostics
        id: unit
        continue-on-error: true
        shell: bash
        run: |
          set +e
          log="$RUNNER_TEMP/unit-failures.log"
          npm run test:unit > "$log" 2>&1
          status=$?
          cat "$log"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Upload unit diagnostics
        if: steps.unit.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: unit-failures
          path: ${{ runner.temp }}/unit-failures.log
          if-no-files-found: error
          retention-days: 2
      - name: Enforce unit suite
        if: steps.unit.outcome == 'failure'
        run: exit 1

  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - name: Verify synchronized release metadata
        run: node scripts/sync-release-metadata.cjs --check
      - name: Verify release consistency
        id: consistency
        continue-on-error: true
        shell: bash
        run: |
          set +e
          log="$RUNNER_TEMP/release-consistency.log"
          npm run release:consistency > "$log" 2>&1
          status=$?
          cat "$log"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Upload release consistency diagnostics
        if: steps.consistency.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: release-consistency-failures
          path: ${{ runner.temp }}/release-consistency.log
          if-no-files-found: error
          retention-days: 2
      - name: Enforce release consistency
        if: steps.consistency.outcome == 'failure'
        run: exit 1
      - name: Verify syntax, builder config and web build
        run: npm run check
      - name: Run unit, API, integration and realtime tests
        run: npm run test:unit
      - name: Run performance test
        run: npm run test:performance
      - name: Run security invariant and dependency audit
        id: security
        continue-on-error: true
        shell: bash
        run: |
          set +e
          log="$RUNNER_TEMP/security-audit.log"
          npm run audit:security > "$log" 2>&1
          status=$?
          cat "$log"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Upload security diagnostics
        if: steps.security.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-failures
          path: ${{ runner.temp }}/security-audit.log
          if-no-files-found: error
          retention-days: 2
      - name: Enforce security audit
        if: steps.security.outcome == 'failure'
        run: exit 1

  schema9-soak:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - name: Run schema 9 soak with retained diagnostics
        id: soak
        continue-on-error: true
        shell: bash
        env:
          NEXORA_SOAK_MINUTES: "1"
          NEXORA_SOAK_INTERVAL_MS: "500"
        run: |
          set +e
          log="$RUNNER_TEMP/schema9-soak.log"
          npm run test:soak > "$log" 2>&1
          status=$?
          cat "$log"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Upload schema 9 soak diagnostics
        if: steps.soak.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: schema9-soak-failures
          path: ${{ runner.temp }}/schema9-soak.log
          if-no-files-found: error
          retention-days: 2
      - name: Enforce schema 9 soak
        if: steps.soak.outcome == 'failure'
        run: exit 1

  android-source:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - run: gradle -p android :app:assembleDebug --no-daemon
