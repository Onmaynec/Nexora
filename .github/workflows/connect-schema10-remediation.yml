name: Nexora Connect schema 10 remediation

on:
  push:
    branches: [release/3.6.0-connect]
    paths:
      - '.connect-remediation/SCHEMA10'

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/3.6.0-connect
          fetch-depth: 0
          show-progress: false
      - name: Update schema 10 regression expectations
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');

          function update(path, transform) {
            const before = fs.readFileSync(path, 'utf8');
            const after = transform(before);
            if (after === before) throw new Error(`No changes applied to ${path}`);
            fs.writeFileSync(path, after, 'utf8');
          }

          update('test/mobile-continuity.test.cjs', (source) => source
            .replace('test("schema 9 API keeps push secrets private and resumes uploads from confirmed offset"', 'test("schema 10 API keeps push secrets private and resumes uploads from confirmed offset"')
            .replace('assert.equal(status.schemaVersion, 9);', 'assert.equal(status.schemaVersion, 10);'));

          update('test/pulse-local-integration.test.cjs', (source) => source
            .replace('test("schema 9 is active and Pulse API requires authentication"', 'test("schema 10 is active and Pulse API requires authentication"')
            .replace('assert.equal(instance.store.stats().schemaVersion, 9);', 'assert.equal(instance.store.stats().schemaVersion, 10);')
            .replace('assert.equal(instance.store.db.prepare("SELECT value FROM meta WHERE key=\'schema_version\'").get().value, "9");', 'assert.equal(instance.store.db.prepare("SELECT value FROM meta WHERE key=\'schema_version\'").get().value, "10");')
            .replace('assert.equal(status.body.schemaVersion, 9);', 'assert.equal(status.body.schemaVersion, 10);'));

          update('test/regression-3.2.1.test.cjs', (source) => source
            .replace('test("schema 9 status remains readable after server close"', 'test("schema 10 status remains readable after server close"')
            .replace('assert.equal(status.schemaVersion, 9);', 'assert.equal(status.schemaVersion, 10);'));

          update('scripts/soak-test.cjs', (source) => source
            .replace('if (instance.status().schemaVersion !== 9)', 'if (instance.status().schemaVersion !== 10)'));
          NODE

          rm -rf .connect-diagnostics
          rm -f .connect-patch-diagnostics.json
          rm -f .github/workflows/connect-diagnostics.yml
          rm -f release-evidence/3.6.0/diagnostics/check.status
          rm -f release-evidence/3.6.0/diagnostics/connect-focused.status
          rm -f release-evidence/3.6.0/diagnostics/soak.status
          rm -f release-evidence/3.6.0/diagnostics/unit.status
          rm -rf .connect-remediation
          rm -f .github/workflows/connect-schema10-remediation.yml
      - name: Commit remediation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'nexora-release-bot'
          git config user.email 'nexora-release-bot@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(connect): synchronize schema 10 regression gates'
          git push origin HEAD:release/3.6.0-connect
