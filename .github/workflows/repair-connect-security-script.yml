name: Repair Connect security patch

on:
  push:
    branches: [release/3.6.0-connect]
    paths:
      - '.connect-security/REPAIR'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/3.6.0-connect
          fetch-depth: 0
      - run: node scripts/repair-connect-security-script.cjs
      - run: node --check scripts/apply-connect-security-hardening.cjs
      - name: Commit repaired patch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .connect-security/REPAIR
          rm -f .github/workflows/repair-connect-security-script.yml
          rm -f scripts/repair-connect-security-script.cjs
          git config user.name 'nexora-release-bot'
          git config user.email 'nexora-release-bot@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(connect): allow incoming call session claim'
          git push origin HEAD:release/3.6.0-connect
