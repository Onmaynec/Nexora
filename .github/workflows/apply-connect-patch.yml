name: Apply Nexora 3.6.0 Connect implementation

on:
  push:
    branches: [release/3.6.0-connect]
    paths:
      - '.connect-patch/**'
      - '.github/workflows/apply-connect-patch.yml'
  pull_request:
    branches: [main]
    paths:
      - '.connect-patch/**'
      - '.github/workflows/apply-connect-patch.yml'

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Diagnose implementation archive through Contents API
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/connect-chunks
          for name in 00 01 02 03 04; do
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/.connect-patch/${name}?ref=release%2F3.6.0-connect" \
              | jq -r '.content' | base64 --decode > "/tmp/connect-chunks/${name}"
          done
          wc -c /tmp/connect-chunks/*
          sha256sum /tmp/connect-chunks/*
          cat /tmp/connect-chunks/* | tr -d '\r\n' | base64 --decode > /tmp/connect-patch.tgz || true
          wc -c /tmp/connect-patch.tgz
          sha256sum /tmp/connect-patch.tgz
          exit 1
