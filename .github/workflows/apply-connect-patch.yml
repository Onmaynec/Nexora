name: Apply Nexora 3.6.0 Connect implementation

on:
  push:
    branches: [release/3.6.0-connect]
    paths:
      - '.connect-patch-v2/READY'

permissions:
  contents: write

concurrency:
  group: apply-connect-patch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/3.6.0-connect
          fetch-depth: 0
          show-progress: false

      - name: Reconstruct and validate implementation archive
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .connect-patch-v2 -maxdepth 1 -type f -name '[0-9][0-9]' | wc -l)" -eq 25
          cat .connect-patch-v2/[0-9][0-9] | tr -d '\r\n' > /tmp/connect-patch.b64
          test "$(wc -c < /tmp/connect-patch.b64)" -eq 48788
          base64 --decode /tmp/connect-patch.b64 > /tmp/connect-patch.tgz
          echo '2e2d9fda348eae0584344a2ff01e044b4c9b0f04dcef1ac59e45fe899b4918c6  /tmp/connect-patch.tgz' | sha256sum --check --strict
          tar -tzf /tmp/connect-patch.tgz

      - name: Apply and syntax-check implementation
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf /tmp/connect-patch.tgz
          node --check server/connect.cjs
          node --check server/connect-schema10.cjs
          node --check server/create-server-v31.cjs
          node --check test/connect-3.6.test.cjs
          rm -rf .connect-patch .connect-patch-v2
          rm -f .github/workflows/apply-connect-patch.yml

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "nexora-release-bot"
          git config user.email "nexora-release-bot@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(connect): implement Nexora 3.6.0 core"
          git push origin HEAD:release/3.6.0-connect
