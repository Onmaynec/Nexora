name: Apply Nexora 3.6.0 Connect implementation

on:
  push:
    branches: [release/3.6.0-connect]
    paths:
      - '.connect-patch/**'
      - '.github/workflows/apply-connect-patch.yml'
  pull_request:
    branches: [main]
    paths:
      - '.connect-patch/**'
      - '.github/workflows/apply-connect-patch.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/3.6.0-connect
          fetch-depth: 1
          show-progress: false
      - name: Diagnose implementation archive
        shell: bash
        run: |
          wc -c .connect-patch/*
          sha256sum .connect-patch/*
          cat .connect-patch/0* | tr -d '\r\n' | base64 --decode > /tmp/connect-patch.tgz || true
          wc -c /tmp/connect-patch.tgz
          sha256sum /tmp/connect-patch.tgz
          exit 1
