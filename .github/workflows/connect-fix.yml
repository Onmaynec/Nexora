name: Nexora 3.6.0 corrected patch and verification

on:
  push:
    branches: [release/3.6.0-connect]
    paths:
      - '.connect-fix/READY'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/3.6.0-connect
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - name: Reconstruct and verify patch archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/nexora-connect-fix
          cat .connect-fix/00 .connect-fix/01 | base64 --decode > /tmp/nexora-connect-fix.tar.gz
          echo 'f380106a50a3a3d934f62835f4c66278affd83d553747e7120cda3edf20e2d27  /tmp/nexora-connect-fix.tar.gz' | sha256sum --check
          tar -xzf /tmp/nexora-connect-fix.tar.gz -C /tmp/nexora-connect-fix
          cp -a /tmp/nexora-connect-fix/. .
      - name: Apply corrected source and metadata transformations
        run: node scripts/apply-connect-fix.cjs
      - name: Remove one-shot patch transport
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .connect-fix
          rm -f .github/workflows/connect-fix.yml scripts/apply-connect-fix.cjs
      - name: Commit corrected Connect candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'nexora-release-bot'
          git config user.email 'nexora-release-bot@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(connect): restore release consistency sources and docs'
          git push origin HEAD:release/3.6.0-connect
      - run: npm ci
      - name: Verify release consistency
        run: |
          npm run release:sync-version -- --check
          npm run release:consistency
      - name: Verify syntax and web build
        run: npm run check
      - name: Run focused regressions
        run: node --test test/connect-3.6.test.cjs test/release-consistency.test.cjs test/mobile-continuity.test.cjs test/pulse-local-integration.test.cjs test/regression-3.2.1.test.cjs
      - name: Run bounded soak
        env:
          NEXORA_SOAK_MINUTES: '0.03'
          NEXORA_SOAK_INTERVAL_MS: '250'
        run: npm run test:soak
