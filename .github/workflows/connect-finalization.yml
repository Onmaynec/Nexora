name: Finalize Nexora 3.6.0 source gates

on:
  push:
    branches: [release/3.6.0-connect]
    paths:
      - '.connect-finalization/READY'
  pull_request:
    branches: [main]
    paths:
      - '.connect-finalization/READY'
      - '.github/workflows/connect-finalization.yml'
      - '.github/workflows/ci.yml'
      - 'scripts/apply-connect-finalization.cjs'

permissions:
  contents: write

concurrency:
  group: connect-finalization-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  finalize:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/release/3.6.0-connect') ||
      (github.event_name == 'pull_request' && github.head_ref == 'release/3.6.0-connect')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/3.6.0-connect
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - name: Apply final source gates
        run: node scripts/apply-connect-finalization.cjs
      - name: Verify JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check server/connect.cjs
          node --check server/model.cjs
          node --check server/create-server.cjs
          node --check scripts/check-release-consistency.cjs
          node --check test/connect-3.6.test.cjs
          node --check test/release-consistency.test.cjs
      - name: Verify release consistency
        run: npm run release:consistency
      - name: Verify production web build and static checks
        run: npm run check
      - name: Run focused Connect and release tests
        run: node --test --test-concurrency=1 test/release-consistency.test.cjs test/connect-3.6.test.cjs test/build-config.test.cjs test/release-3.2.5-regressions.test.cjs test/release-3.3.0-regressions.test.cjs
      - name: Commit verified finalization
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/apply-connect-finalization.cjs
          git config user.name 'nexora-release-bot'
          git config user.email 'nexora-release-bot@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(connect): finalize release and client lifecycle gates'
          git push origin HEAD:release/3.6.0-connect
