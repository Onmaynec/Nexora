name: Synchronize Nexora 3.6.0 release metadata

on:
  push:
    branches: [release/3.6.0-connect]
    paths:
      - '.connect-release/READY'

permissions:
  contents: write

concurrency:
  group: sync-connect-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/3.6.0-connect
          fetch-depth: 0
          show-progress: false

      - name: Synchronize version surfaces
        shell: bash
        run: |
          set -euo pipefail
          npm version 3.6.0 --no-git-tag-version --ignore-scripts
          node scripts/sync-release-metadata.cjs
          node scripts/sync-release-metadata.cjs --check
          rm -rf .connect-release
          rm -f .github/workflows/sync-connect-release.yml

      - name: Commit synchronized metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "nexora-release-bot"
          git config user.email "nexora-release-bot@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore(release): synchronize Nexora 3.6.0 metadata"
          git push origin HEAD:release/3.6.0-connect
